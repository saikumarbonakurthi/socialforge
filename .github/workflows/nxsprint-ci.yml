name: nxsprint-ci
on:
  push:
    paths: ["nxsprint/**", ".github/workflows/nxsprint-ci.yml"]
  pull_request:
    paths: ["nxsprint/**", ".github/workflows/nxsprint-ci.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nxsprint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nxsprint/core/pyproject.toml
      - run: make install
      - run: make lint
      - run: make test
