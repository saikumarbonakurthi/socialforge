# SAMPLE VALUES. Every number, time and name below is a placeholder, not a decision.
# Copy to projects.yaml and replace with real values. While `placeholder: true`,
# NxSprint refuses to start in live mode, so sample values can never message a human.
placeholder: true
projects:
  - name: Demo Project
    github: {org: sria-demo, repo: demo-app, project_number: 1}
    fields: {status: Status, estimate: Estimate, sprint: Sprint, priority: Priority}
    statuses: {in_progress: In Progress, done: Done}
    sprint_length_days: 14
    timezone: Asia/Kolkata
    working_days: [1, 2, 3, 4, 5]
    working_hours: {start: "09:30", end: "18:30"}
    quiet_hours: {start: "19:00", end: "09:00"}
    holidays: []
    standup_time: "09:45"
    standup_summary_time: "10:30"
    priority_order: [Urgent, High, Medium, Low]
    ceremonies:
      planning_prep_working_days_before_sprint_end: 2
      retro_prep_working_days_before_sprint_end: 0
      weekly_report_weekday: 5
      weekly_report_time: "16:00"
    members:
      - {name: Asha, github_login: asha-demo, teams_user_id: demo-asha, role: lead,
         timezone: Asia/Kolkata, capacity_points: 20}
      - {name: Ravi, github_login: ravi-demo, teams_user_id: demo-ravi, role: member,
         timezone: Asia/Kolkata, capacity_points: 20}
    cooldowns:
      hours: {STALE_IN_PROGRESS: 24, UNASSIGNED_IN_SPRINT: 24, NO_ESTIMATE: 24,
              OVERLOADED_MEMBER: 48, SPRINT_AT_RISK: 24, PR_WAITING_REVIEW: 24,
              BLOCKED_LABEL_AGING: 24}
    thresholds:
      stale_no_activity_working_days: 2
      stale_status_unchanged_working_days: 3
      pr_review_wait_hours: 24
      pr_approved_unmerged_working_days: 2
      blocked_label_working_days: 2
      max_parallel_in_progress: 3
      sprint_risk_no_done_working_days: 3
      sprint_risk_gap_pct: 25
      blocked_label: blocked
    escalation: {ack_hours_before_channel: 4, ack_hours_before_lead: 8}
    channels:
      team_webhook_env: TEAMS_WEBHOOK_DEMO_TEAM
      dm_webhook_env: TEAMS_WEBHOOK_DEMO_DM
      owner_report_target: sai
